  - name: '🚀 Auto Select (url-test)'
    type: url-test
    tolerance: 150
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    lazy: true
    proxies:
    # LEAVE THIS LINE!
    remnawave:
      exclude-filter: '⚠️|🛡️|🔒|🛜|📶'

  - name: '🇷🇺 RU Servers (url-test)'
