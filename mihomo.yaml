  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  # Приватные сети
  - RULE-SET,geoip-private,DIRECT,no-resolve
  # Российские сайты
  - DOMAIN-SUFFIX,sberbank.ru,RU сайты
  - DOMAIN-SUFFIX,reddit.com,RU сайты
  - DOMAIN-SUFFIX,mail.rwb.ru,DIRECT
  - RULE-SET,ru-whitelist,DIRECT
  - RULE-SET,ru-whitelist-ip,DIRECT
  - RULE-SET,geosite-category-ru,RU сайты
  - DOMAIN-SUFFIX,ru,RU сайты
  - DOMAIN-SUFFIX,by,RU сайты
  - DOMAIN-SUFFIX,xn--p1ai,RU сайты
  - DOMAIN-SUFFIX,yandex-pogoda.static-storage.net,RU сайты
  - RULE-SET,geoip-ru,RU сайты,no-resolve
  # AI
  - RULE-SET,geosite-category-ai,AI
  # Сервисы
  - RULE-SET,discord,Discord
  - RULE-SET,geosite-discord,Discord
  - RULE-SET,geosite-linkedin,Linkedin
  - RULE-SET,geosite-netflix,Netflix
  - RULE-SET,geoip-netflix,Netflix,no-resolve
  - RULE-SET,geosite-spotify,Spotify
  - RULE-SET,geosite-category-speedtest,Speedtest
  - RULE-SET,geosite-steam,Steam
  - RULE-SET,geosite-microsoft,Microsoft
  - RULE-SET,geosite-apple,Apple
