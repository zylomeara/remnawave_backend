    tolerance: 150
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 3000
    lazy: true
    proxies:
    # LEAVE THIS LINE!
    remnawave:
      filter: '🇷🇺'
      exclude-filter: '⚠️|🛡️|🔒|🛜|📶'

  # ========== БАЗОВЫЕ ГРУППЫ ==========

  - name: '📶 Мобильный интернет'
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 30
    timeout: 5000
    tolerance: 200
    max-failed-times: 5
    lazy: false
    proxies:
    # LEAVE THIS LINE!
    remnawave:
      filter: '📶'

  # ========== FALLBACK ОБЁРТКИ ==========

  - name: '🚀 Auto Select'
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    hidden: *hidden
    interval: 30
    timeout: 2000
    lazy: false
    remnawave:
      include-proxies: false
    proxies:
      - 🚀 Auto Select (url-test)
      - 📶 Мобильный интернет

  - name: '🇷🇺 RU Servers'
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    hidden: *hidden
    interval: 30
    timeout: 2000
    lazy: false
    remnawave:
      include-proxies: false
    proxies:
      - 🇷🇺 RU Servers (url-test)
      - 📶 Мобильный интернет

  - name: '🌍 Abroad Servers'
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    hidden: *hidden
    interval: 30
    timeout: 2000
    lazy: false
    remnawave:
      include-proxies: false
    proxies:
      - 🌍 Abroad Servers (url-test)
      - 🇷🇺 RU Servers (url-test)
      - 📶 Мобильный интернет

  # ========== Служебные группы ==========

  - name: '🌍 Abroad Servers (fastest ss connection)'
    type: url-test
    url: https://health.gerline.store/health
    interval: 30
    timeout: 3000
    tolerance: 30
    hidden: *hidden
    lazy: false
    proxies:
    # LEAVE THIS LINE!
    remnawave:
      include-type:
        - ss
      exclude-filter: '🇷🇺|🔒|🛜|📶'

  - name: '🛡️ YT No Ads - Auto'
    hidden: *hidden
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    timeout: 2000
    proxies:
    # LEAVE THIS LINE!
    remnawave:
      filter: '🇷🇺.*🛡️|🛡️.*🇷🇺'

  - name: '🛡️ YouTube без рекламы'
    hidden: *hidden
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    timeout: 2000
    remnawave:
      include-proxies: false
    proxies:
      - '🛡️ YT No Ads - Auto'
      - SAFE_DIRECT

  - name: '📺 YouTube с рекламой'
    type: select
    hidden: *hidden
    remnawave:
      include-proxies: false
    proxies:
      - 🌍 Abroad Servers
      - 🚀 Auto Select
      - 🇷🇺 RU Servers
      - SAFE_DIRECT

  - name: 'SAFE_DIRECT'
    type: url-test
    url: https://connectivitycheck.gstatic.com/generate_204
    expected-status: 204
    interval: 15
    timeout: 7000
    lazy: false
    max-failed-times: 2
    remnawave:
      include-proxies: false
    proxies:
      - 📶 Мобильный интернет
      - DIRECT

# --- ПРОВАЙДЕРЫ ПРАВИЛ ---
rule-providers:
  # ── Whitelist (live proxy → hxehex) ──
  ru-whitelist:
    type: http
    behavior: domain
    url: https://static.gerline.store/whitelist/whitelist.txt
    path: ./ruleset/ru-whitelist.txt
    interval: 86400
  ru-whitelist-ip:
    type: http
    behavior: ipcidr
    url: https://static.gerline.store/whitelist/cidrwhitelist.txt
    path: ./ruleset/ru-whitelist-ip.txt
    interval: 86400

  # ── Discord (inline) ──
  discord:
    type: inline
    behavior: classical
    format: text
    payload:
      - AND,((DOMAIN-KEYWORD,discord),(NOT,((DOMAIN-SUFFIX,ru))))
      - AND,((IP-CIDR,34.0.192.0/18,no-resolve),(NETWORK,UDP),(DST-PORT,50000-50100))
