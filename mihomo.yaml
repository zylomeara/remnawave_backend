tcp-concurrent: false
mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
unified-delay: true
ipv6: false
global-client-fingerprint: chrome
keep-alive-idle: 30
keep-alive-interval: 30
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24

# --- ПЕРЕМЕННЫЕ ---
hidden_flag: &hidden false

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 3478, 5222, 8443]
    QUIC:
      ports: [443, 3478]
  force-domain:
    - +.instagram.com
    - +.facebook.com
    - +.fbcdn.net
    - +.cdninstagram.com
    - +.whatsapp.net
    - +.whatsapp.com

dns:
  enable: true
  enhanced-mode: fake-ip
  hosts:
    white-ru1.gerline.store: 51.250.111.90
    white-ru2.gerline.store: 51.250.30.54
    se1.gerline.store: 64.112.124.139
    dns.gerline.store: 51.250.111.90
    static.gerline.store: 51.250.111.90
    cp.cloudflare.com: 1.1.1.1
    connectivitycheck.gstatic.com: 142.250.74.99
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.stun.*.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 77.88.8.8
  nameserver:
    - https://dns.gerline.store/dns-query
  proxy-server-nameserver:
    - 77.88.8.8
    - 77.88.8.1


tun:
  enable: true
  stack: mixed
  mtu: 1400
  dns-hijack:
    - 0.0.0.0:53
  auto-route: true
  auto-detect-interface: true
  inet4-address:
    - 198.18.0.1/16
  route-exclude:
    - 1.1.1.1/32
    - 51.250.111.90/32
    - 51.250.30.54/32
    - 64.112.124.139/32
    - 213.171.30.158/32
    - 91.224.87.36/32
    - 209.97.137.88/32
    - 85.92.108.138/32
    - 104.194.149.32/32


